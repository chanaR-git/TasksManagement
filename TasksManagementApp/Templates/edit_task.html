<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>עריכת משימה</title>
</head>
<body>
    <h2>עריכת משימה</h2>
    <form method="post">
        {% csrf_token %}
        <label>שם משימה: <input type="text" name="task_name" value="{{ task.task_name }}" required></label><br>
        <label>תיאור: <input type="text" name="task_description" value="{{ task.task_description }}" required></label><br>
        <label>תאריך יעד: <input type="date" name="task_last_date" value="{{ task.task_last_date }}" required></label><br>
        <button type="submit">שמור</button>
    </form>
    <a href="{% url 'tasks' %}">חזור</a>
</body>
</html>
