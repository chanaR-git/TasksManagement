{% load static %}
<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>עריכת משימה</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body dir="rtl">
<div class="container mt-4">
    <h2>עריכת משימה</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">שם משימה</label>
            <input type="text" name="task_name" class="form-control" value="{{ task.task_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">תיאור</label>
            <textarea name="task_description" class="form-control" required>{{ task.task_description }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">תאריך יעד</label>
            <input type="date" name="task_last_date" class="form-control" value="{{ task.task_last_date|date:'Y-m-d' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">סטטוס</label>
            <select name="task_status" class="form-select" required>
                <option value="1" {% if task.task_status == 1 %}selected{% endif %}>חדש</option>
                <option value="2" {% if task.task_status == 2 %}selected{% endif %}>בתהליך</option>
                <option value="3" {% if task.task_status == 3 %}selected{% endif %}>הושלם</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">שמור</button>
        <a href="{% url 'tasks' %}" class="btn btn-secondary">ביטול</a>
    </form>
    {% if task.id %}
      <a href="{% url 'edit_task' task.id %}">ערוך</a>
    {% endif %}
</div>
</body> 
</html>
