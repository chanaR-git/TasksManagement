{% load static %}
<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .user-menu { position: relative; display: inline-block; }
        .user-dropdown {
            display: none;
            position: absolute;
            left: 0;
            top: 40px;
            background: #fff;
            min-width: 140px;
            box-shadow: 0 2px 8px #0002;
            border-radius: 8px;
            z-index: 100;
        }
        .user-menu:hover .user-dropdown { display: block; }
        .user-dropdown a { display: block; padding: 10px 16px; color: #333; text-decoration: none; }
        .user-dropdown a:hover { background: #f0f4fa; }
        .task-card { margin-bottom: 18px; }
        .task-actions button { margin-left: 6px; }
        .add-task-modal .modal-dialog { direction: rtl; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Register</h1>
            <form method="post">
                {% csrf_token %}
                {{form.as_p}}
                <button type="submit">Register</button>
            </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
